dependencies:
  idf:
    version: ">=5.5"
  espressif/mdns:
    version: "^1.4"
  espressif/esp_tinyusb:
    version: "~1.7"
    # Only pulled in on targets that have a USB OTG controller. Without this
    # rule, building the bench backend for a C3 fails while resolving a
    # component it will never compile.
    rules:
      - if: "target in [esp32s3, esp32s2]"
