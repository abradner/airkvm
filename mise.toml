# Toolchain pins and tasks for the whole monorepo — run `mise install` first.
#
# Tasks are namespaced by tree, because a bare `build` in a repo holding
# firmware, a Rails service and a marketing site names nothing:
#   fw:*        firmware/           (ESP-IDF; every one runs with dir = "firmware")
#   console:*   packages/console/   (the shared browser console)
#   co:*        coordinator/        (Rails fleet coordinator)
#   mk:*        marketing/          (Astro; not yet present)
# **`co:*` is deliberately NOT in the umbrellas.** Every other tree's checks run
# from a bare checkout; the coordinator's need a Postgres container up and, for
# bundler-audit, the network. Because an umbrella kills its siblings on the
# first failure (§6.1), wiring co:test in would mean `mise run test` on a fresh
# worktree killed fw:test and console:test and reported red for a firmware-only
# change — the daily gate degraded by a tree most sessions never touch. Run
# `mise run co:db && mise run co:test` for the coordinator. Revisit if its
# checks ever become hermetic.
#
# The unnamespaced `test`, `lint` and `fmt` are umbrellas across the trees, so
# "did I break anything" stays one command as trees are added. They report
# failure honestly but **stop at the first one** — §6.1 has the measurement —
# so a red umbrella means the trees after it are unknown, not fine. CI does not
# rely on them for that reason: it runs each check as its own step with
# `if: always()`.

[tools]
python = "3.15.2"
cmake = "4.5.0"
ninja = "1.13.2"
ruff = "0.17.5"
clang-format = "23.1.1"
# For the console's type checker only. TypeScript 7 IS the native (Go) compiler
# — the separate @typescript/native-preview package was superseded — so `tsc`
# here is a platform binary behind a thin launcher, and node is present to run
# that launcher and to install it. The console itself still has no build step,
# no npm and no node_modules (§4): nothing in packages/console is compiled, and
# the firmware embeds the literal files.
node = "26"
"npm:typescript" = "7.0.2"
# The coordinator (Rails). Exact, not "4.0": coordinator/.ruby-version and the
# Dockerfile both say 4.0.6, and a floating pin here would be a second, later
# Ruby the moment 4.0.7 ships — §6.1's "a version pinned in one place and
# floating in another is two versions", which this repo has already paid for
# once with clang-format. .ruby-version stays because `rails new` writes it and
# non-mise tooling reads it; this file is what mise resolves.
ruby = "4.0.6"

# ESP-IDF itself is not a mise-managed tool: it is a git checkout plus its own
# installer that fetches per-target compilers. `mise run fw:setup` handles both and
# is idempotent. IDF_PATH/IDF_TOOLS_PATH below point at that checkout.

[env]
IDF_PATH = "{{config_root}}/.esp-idf"
IDF_TOOLS_PATH = "{{config_root}}/.esp-idf-tools"
# Deliberately no IDF_TARGET here: the target belongs to the build, not the
# shell. Setting it globally makes it conflict with the bench build's esp32c3
# and produces a "not consistent with target in the environment" error that
# looks like a project bug rather than an env var. Each build carries its own.
# No PORT here, and that is deliberate — see FLASH_PORT_ENV below. `[env]` is
# applied to EVERY process mise starts, and in a monorepo `PORT` means two
# different things: the firmware's serial device, and the TCP port Rails binds.
# A global `/dev/ttyACM0` default here made Puma try to listen on TCP port
# "/dev/ttyACM0", so `mise run co:dev` crashed on its first line. The serial
# default now lives only on the three tasks that flash.

[tasks."fw:setup"]
dir = "firmware"
shell = "bash -c"
description = "Clone and install ESP-IDF v5.5 + toolchains (one-time, idempotent, ~4GB)"
run = """
set -e
if [ ! -d "$IDF_PATH" ]; then
  git clone --branch v5.5 --depth 1 --recursive \
    https://github.com/espressif/esp-idf.git "$IDF_PATH"
fi
# esp32c3 as well as esp32s3: the C3 can't do USB HID, but it runs everything
# else, so it is the bench board for the network/console/protocol paths.
"$IDF_PATH/install.sh" esp32c3,esp32s3
echo "ESP-IDF ready. Subsequent tasks source it automatically."
"""

[tasks."fw:config"]
dir = "firmware"
shell = "bash -c"
description = "Open menuconfig (WiFi credentials live under the 'airkvm' menu)"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py menuconfig'

[tasks."fw:build"]
dir = "firmware"
shell = "bash -c"
description = "Build the ESP32-S3 firmware image (the real dongle)"
run = """
. "$IDF_PATH/export.sh" >/dev/null
idf.py -B build \
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.local" build
"""

[tasks."fw:build-bench"]
dir = "firmware"
shell = "bash -c"
description = "Build the ESP32-C3 bench image — no USB HID, logs intents instead"
# Separate build dir: switching IDF_TARGET in one directory forces a full
# reconfigure every time you alternate boards.
run = """
. "$IDF_PATH/export.sh" >/dev/null
idf.py -B build-bench -DIDF_TARGET=esp32c3 \
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench;sdkconfig.local" \
  -DSDKCONFIG=sdkconfig.bench.generated build
"""

# FLASH_PORT_ENV: the serial port for flashing, set only on the three flash
# tasks. Written as a default-if-unset rather than a plain value, because a bare
# assignment would override the inherited environment and silently ignore
# `PORT=... mise run fw:flash` — flashing the wrong board, or reporting "port is
# busy" while naming a port you did not ask for. Overrides work per invocation:
#   PORT=/dev/tty.usbmodem1101 mise run fw:flash
#   PORT=rfc2217://otherhost:4000 mise run fw:flash-bench  (firmware/tools/serial_bridge.py)
[tasks."fw:flash-bench"]
dir = "firmware"
env = { PORT = "{{ env.PORT | default(value='/dev/ttyACM0') }}" }
shell = "bash -c"
description = "Flash + monitor the ESP32-C3 bench board"
run = """
. "$IDF_PATH/export.sh" >/dev/null
idf.py -B build-bench -DSDKCONFIG=sdkconfig.bench.generated -p "$PORT" flash monitor
"""

[tasks."fw:build-lcd147"]
dir = "firmware"
shell = "bash -c"
description = "Build the Waveshare ESP32-S3-LCD-1.47B image (ST7789, 16MB)"
# Same shape as build-bench, minus -DIDF_TARGET: both S3 boards are esp32s3, so
# the Kconfig board symbol is the only thing telling them apart. The separate
# -DSDKCONFIG is mandatory rather than tidy — a defaults file cannot change a
# symbol an existing sdkconfig already holds (AGENTS.md §6.1), so sharing the
# dongle's generated config would silently build this board at 4MB.
run = """
. "$IDF_PATH/export.sh" >/dev/null
idf.py -B build-lcd147 \
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.lcd147;sdkconfig.local" \
  -DSDKCONFIG=sdkconfig.lcd147.generated build
"""

[tasks."fw:flash-lcd147"]
dir = "firmware"
env = { PORT = "{{ env.PORT | default(value='/dev/ttyACM0') }}" }
shell = "bash -c"
description = "Flash + monitor the ESP32-S3-LCD-1.47B"
run = """
. "$IDF_PATH/export.sh" >/dev/null
idf.py -B build-lcd147 -DSDKCONFIG=sdkconfig.lcd147.generated -p "$PORT" flash monitor
"""

[tasks."fw:flash"]
dir = "firmware"
env = { PORT = "{{ env.PORT | default(value='/dev/ttyACM0') }}" }
shell = "bash -c"
description = "Flash and monitor (board must be in bootloader mode — see AGENTS.md §6.1)"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py -p "$PORT" flash monitor'

[tasks."fw:clean"]
dir = "firmware"
shell = "bash -c"
description = "Remove build artifacts"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py fullclean'

[tasks."fw:test"]
description = "Host-side unit tests for pure logic (keymap, protocol) — no hardware needed"
dir = "firmware/test/host"
run = """
cmake -B build -G Ninja
cmake --build build
ctest --test-dir build --output-on-failure
"""

[tasks."fw:lint"]
dir = "firmware"
description = "Check formatting and lint (firmware C, tools Python)"
run = """
set -e
# `-name build -prune` matters: CMake generates its own .c files under
# firmware/test/host/build, and formatting those fails lint on any machine that
# has run the tests. CI never saw it because a fresh checkout has no build dir.
find main test -name build -prune -o \\( -name '*.c' -o -name '*.h' \\) -print \\
  | xargs -r clang-format --dry-run --Werror
ruff check tools
ruff format --check tools
"""

[tasks."fw:fmt"]
dir = "firmware"
description = "Apply formatting"
run = """
set -e
find main test -name build -prune -o \\( -name '*.c' -o -name '*.h' \\) -print \\
  | xargs -r clang-format -i
ruff format tools
"""

# --- umbrellas ---------------------------------------------------------------
# One entry per tree as trees land. Listed as `depends` rather than chained in a
# shell: a chain reports the exit status of the last command in it, which is the
# shape AGENTS.md §6.1 records twice as having eaten real work.
#
# They name what they actually cover rather than claiming "everything": an
# umbrella that said "every tree" would be asserting coverage that does not
# exist (§2 principle 1). packages/console now has a test runner and so appears
# below; it still has no linter, so `lint` does not claim it.

[tasks."console:test"]
dir = "packages/console"
description = "Console checks in headless Firefox — no board, no phone needed"
run = "python3 test/runner.py"

[tasks."co:db"]
description = "Start the coordinator's development Postgres (docker compose)"
dir = "coordinator"
run = "docker compose up -d"

[tasks."co:setup"]
description = "Install the coordinator's gems and create its databases"
dir = "coordinator"
# db:prepare rather than db:create+db:migrate: it is idempotent, so this is safe
# to re-run, which is what makes it usable as the one setup command.
run = """
set -e
bundle install
bin/rails db:prepare
"""

[tasks."co:dev"]
description = "Run the coordinator locally (needs co:db)"
dir = "coordinator"
run = "bin/rails server"

[tasks."co:test"]
description = "Coordinator specs (needs co:db)"
dir = "coordinator"
run = "bundle exec rspec"

[tasks."co:lint"]
description = "Coordinator style and security checks"
dir = "coordinator"
# Four separate tools because they answer different questions and a repo that
# runs only the style one has no security gate. Every tool runs whatever the
# others did, and the task fails if any failed: under `set -e` (or a && chain)
# a rubocop offence would stop the run before brakeman, so a style nit would
# hide a security finding — in CI, where this is one step.
run = """
status=0
bundle exec rubocop || status=1
bundle exec brakeman --no-pager --quiet --exit-on-warn --exit-on-error || status=1
bundle exec bundler-audit check --update || status=1
bin/importmap audit || status=1
exit $status
"""

[tasks."co:precompile"]
description = "The image build's asset step, with its build-only stand-ins"
dir = "coordinator"
# One script, run by both the Dockerfile and CI, so the step that builds the
# image is the step that is checked. It once failed on every build unnoticed,
# because nothing but `docker build` ran it.
run = "bin/precompile-assets"

[tasks."co:fmt"]
description = "Apply the coordinator's formatting"
dir = "coordinator"
run = "bundle exec rubocop --autocorrect"

[tasks."console:typecheck"]
description = "Type-check the console's JavaScript (JSDoc types, no build step)"
dir = "packages/console"
# checkJs against the files as they ship — see tsconfig.json for why this is
# never allowed to become a compile step. TypeScript 7 is the native compiler,
# so a full check is well under a second.
run = "tsc -p tsconfig.json"

# Ruff only. Named for what it actually covers rather than for its tree: the
# console's own JavaScript has no linter, and a task called "console:lint" that
# silently skipped app.js would assert coverage that does not exist (§2
# principle 1). Rename it when a JS linter lands.
[tasks."console:lint-python"]
dir = "packages/console"
description = "Lint the console's Python test harness (its JS has no linter yet)"
run = """
set -e
ruff check test
ruff format --check test
"""

# Kept separate from console:test rather than folded into it: this one is only
# meaningful when it FAILS to fail, so running it as part of the suite would
# make a red run ambiguous between "the console broke" and "the harness broke".
[tasks."console:self-test"]
dir = "packages/console"
description = "Plant a bug and require the console checks to catch it (§8)"
run = "python3 test/runner.py --self-test"

[tasks.test]
description = "Every tree that has tests (today: firmware, console)"
depends = ["fw:test", "console:test"]

[tasks.lint]
description = "Every tree that has a linter (firmware C + Python; the console's harness)"
depends = ["fw:lint", "console:lint-python", "console:typecheck"]

[tasks."console:fmt-python"]
dir = "packages/console"
description = "Format the console's Python test harness"
run = "ruff format test"

[tasks.fmt]
description = "Apply formatting in every tree that has a formatter (firmware, console harness)"
depends = ["fw:fmt", "console:fmt-python"]
